<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="A generative AI model that restyles your face live in your browser with an 8 MB model: distilled from a 4B diffusion model, 100% on-device with WebGPU. No server, no app." />
    <title>Real-time AI Filter in the Browser: live demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="screen"></canvas>
    <video id="video" playsinline muted></video>

    <section id="welcome">
      <h1>Real-time AI Filter in the Browser</h1>
      <p>A generative AI model of just <b>8&nbsp;MB</b>, distilled from a 4-billion-parameter diffusion model, redraws every face in your camera feed live, entirely on your device. Nothing is uploaded.</p>
      <button id="start">Start camera</button>
      <p id="message"></p>
    </section>

    <div id="toolbar" hidden>
      <button id="compare">Hold to compare</button>
      <button id="flip">Flip camera</button>
      <span id="stats"></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
